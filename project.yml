name: GuowangQuiz
options:
  bundleIdPrefix: com.guowang
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  GuowangQuiz:
    type: application
    platform: iOS
    sources:
      - path: GuowangQuiz
        excludes:
          - "Info.plist"
          - "www"
      - path: GuowangQuiz/www
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: GuowangQuiz/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.guowang.quiz
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
